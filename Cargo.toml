[package]
name = "todo-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.7"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
azure_data_cosmos = { version = "0.21", default-features = false }
azure_identity    = { version = "0.21", default-features = false }
azure_core        = { version = "0.21", default-features = false, features = ["enable_reqwest_rustls"] }
futures = "0.3"
async-trait = "0.1"
# openssl removed — azure_core now uses rustls (pure Rust, musl-friendly)

# OpenTelemetry
opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.23"
tonic = "0.11"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
