properties:
  configuration:
    ingress:
      external: true
      targetPort: 3000
      corsPolicy:
        allowedOrigins:
          - "https://www.walcron.com"
          - "https://yoonghan.github.io"
        allowedMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        allowedHeaders:
          - "*"
        allowCredentials: true
  template:
    containers:
      - image: ghcr.io/yoonghan/az-walcron:latest
        name: walcron
        resources:
          cpu: 0.5
          memory: 1.0Gi
    scale:
      minReplicas: 0
      maxReplicas: 1
