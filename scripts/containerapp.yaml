properties:
  configuration:
    ingress:
      external: true
      targetPort: 3000
      corsPolicy:
        allowedOrigins:
          - "https://www.walcron.com"
          - "https://yoonghan.github.io"
        allowedMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        allowedHeaders:
          - "*"
        allowCredentials: true
  identity:
    type: SystemAssigned
  template:
    containers:
      - image: ghcr.io/yoonghan/az-walcron:latest
        name: walcron
        env:
          - name: COSMOS_ENDPOINT
            value: "https://walcron-db.documents.azure.com:443/"
          - name: COSMOS_DATABASE
            value: "TodoDatabase"
          - name: COSMOS_CONTAINER
            value: "Todos"
          - name: AZURE_SDK_LOG_LEVEL
            value: "debug"
        resources:
          cpu: 0.5
          memory: 1.0Gi
    scale:
      minReplicas: 0
      maxReplicas: 1
