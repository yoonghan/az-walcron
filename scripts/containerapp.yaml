identity:
  type: SystemAssigned
properties:
  configuration:
    # dapr:
    #   enabled: true
    #   appId: "az-walcron"
    #   appPort: 3000
    #   enableApiLogging: true
    ingress:
      external: true
      allowInsecure: false
      targetPort: 3000
      corsPolicy:
        allowedOrigins:
          - "https://www.walcron.com"
          - "https://yoonghan.github.io"
        allowedMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        allowedHeaders:
          - "*"
        allowCredentials: true
  template:
    containers:
      - image: ghcr.io/yoonghan/az-walcron:latest
        name: walcron
        env:
          - name: APPLICATIONINSIGHTS_CONFIGURATION_CONTENT
            value: "{}"
          - name: AZURE_OPENAI_ENDPOINT
            secretRef: azure-openai-endpoint
          - name: AZURE_OPENAI_API_KEY
            secretRef: azure-openai-key
          - name: AZURE_OPENAI_DEPLOYMENT
            secretRef: azure-openai-deployment
          - name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
            value: text-embedding-3-small
          - name: AZURE_OPENAI_API_VERSION
            value: "2025-04-01-preview" #See https://learn.microsoft.com/en-us/azure/foundry/openai/api-version-lifecycle?tabs=python
          - name: AZURE_APPCONFIG_ENDPOINT
            value: "https://walcronconfig.azconfig.io"
          - name: COSMOSDB_ENDPOINT
            value: "https://walcron-cosmosdb.documents.azure.com:443/"
        resources:
          cpu: 0.5
          memory: 1.0Gi
        probes:
          - type: Liveness
            httpGet:
              path: "/healthz"
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: "/healthz"
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
    scale:
      minReplicas: 0
      maxReplicas: 1