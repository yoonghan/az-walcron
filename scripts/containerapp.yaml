properties:
  configuration:
    dapr:
      enabled: true
      appId: "az-walcron"
      appPort: 3000
    ingress:
      external: true
      targetPort: 3000
      corsPolicy:
        allowedOrigins:
          - "https://www.walcron.com"
          - "https://yoonghan.github.io"
        allowedMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        allowedHeaders:
          - "*"
        allowCredentials: true
  identity:
    type: SystemAssigned
  template:
    containers:
      - image: ghcr.io/yoonghan/az-walcron:latest
        name: walcron
        resources:
          cpu: 0.5
          memory: 1.0Gi
        probes:
          - type: Liveness
            httpGet:
              path: "/healthz"
              port: 3000
            initialDelaySeconds: 5  # Increased for Rust warm-up
            periodSeconds: 10
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: "/healthz"
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
    scale:
      minReplicas: 0
      maxReplicas: 1