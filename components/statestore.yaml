apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: todostore
spec:
  type: state.azure.cosmosdb
  version: v1
  metadata:
  - name: url
    value: ${COSMOS_ENDPOINT}
  - name: masterKey
    value: ${COSMOS_KEY}
  - name: database
    value: ${COSMOS_DATABASE}
  - name: collection
    value: ${COSMOS_CONTAINER}
